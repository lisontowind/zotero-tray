name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - run: python -m unittest discover -s tests -p test_package.py
      - if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/build.py --tag "$GITHUB_REF_NAME"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py --tag "$GITHUB_REF_NAME"
      - name: Package tagged source
        run: git archive --format=zip --prefix="zotero-tray-${GITHUB_REF_NAME#v}/" --output="dist/zotero-tray-${GITHUB_REF_NAME#v}-source.zip" HEAD
      - name: Publish XPI and update manifest together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Zotero Tray $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            dist/*.xpi dist/*.xpi.sha256 dist/*-source.zip dist/updates.json
